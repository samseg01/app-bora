<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #08060f; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #ff6fa0; text-decoration: none; }
    a:hover { color: #ffb443; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: radial-gradient(115% 50% at 20% 0%, #26123f 0%, rgba(38,18,63,0) 58%), #0d0a18; color: #f3eefc; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 26px 22px 0">
    <div style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8dfff" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-family: 'Anton', sans-serif; font-size: 20px; text-transform: uppercase; line-height: 1">Bora<span style="color: #ffb443">?</span></div>
  </div>

  <!-- Auth preguiçosa: mostra o que a pessoa estava fazendo. A tela é continuação,
       não muro. Sem este bloco, "entrar" vira pedágio sem motivo. -->
  <div style="margin: 26px 22px 0; display: flex; gap: 13px; align-items: center; padding: 13px; border-radius: 18px; background: #171223; border: 1px solid rgba(255,61,129,.28)">
    <div style="width: 48px; height: 48px; border-radius: 14px; flex: none; background: linear-gradient(135deg,#ff3d81,#7a1fff)"></div>
    <div style="font-size: 12.5px; line-height: 1.45; color: #b4a9cc">Para salvar o <b style="color: #f3eefc; font-weight: 600">Bar Aurora</b> no seu caderninho, a gente precisa saber quem é você.</div>
  </div>

  <div style="padding: 30px 22px 0">
    <h1 style="font-family: 'Anton', sans-serif; font-size: 38px; line-height: 1; text-transform: uppercase; margin: 0">Entrar</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 0">
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #6f6690">email</span>
      <div style="padding: 15px 16px; border-radius: 16px; background: #141024; border: 1px solid rgba(255,255,255,.1); font-size: 14.5px; color: #6f6690">voce@email.com</div>
    </label>
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #6f6690">senha</span>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 16px; border-radius: 16px; background: #141024; border: 1.5px solid #ff3d81">
        <span style="font-size: 15px; letter-spacing: 3px; color: #cfc6e2">••••••••</span>
        <span style="font-size: 12px; font-weight: 600; color: #8478a0">mostrar</span>
      </div>
    </label>
  </div>

  <div style="padding: 22px 22px 0">
    <div style="border-radius: 16px; background: #ff3d81; color: #fff; text-align: center; padding: 16px; font-size: 15px; font-weight: 700">Entrar e salvar</div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 26px 22px 0">
    <div style="flex: 1; height: 1px; background: rgba(255,255,255,.08)"></div>
    <span style="font-size: 11px; color: #6f6690">ainda não tem conta?</span>
    <div style="flex: 1; height: 1px; background: rgba(255,255,255,.08)"></div>
  </div>

  <div style="padding: 16px 22px 0">
    <div style="border-radius: 16px; border: 1px solid rgba(255,255,255,.16); text-align: center; padding: 15px; font-size: 14.5px; font-weight: 600; color: #e8dfff">Criar conta</div>
  </div>

  <!-- O que NÃO é pedido também é mensagem: o app vive de confiança. -->
  <div style="margin-top: auto; padding: 0 22px 34px">
    <div style="display: flex; gap: 11px; align-items: flex-start; padding: 14px 15px; border-radius: 16px; background: rgba(31,208,255,.06); border: 1px solid rgba(31,208,255,.16)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1fd0ff" stroke-width="2" style="flex: none; margin-top: 1px"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      <div style="font-size: 12px; line-height: 1.5; color: #b4a9cc">Email e senha, só. Sem telefone, sem rede social, sem localização em segundo plano.</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
