services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boraroles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boraroles}
      POSTGRES_DB: ${POSTGRES_DB:-boraroles}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boraroles}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      # Mesmo caminho de produção, para que o dev não descubra em campo que o diretório
      # das fotos era outro. O volume é local e separado do de produção.
      FOTOS_DIR: /dados/fotos
    volumes:
      - fotos:/dados/fotos
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
  fotos:
