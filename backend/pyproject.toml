[project]
name = "boraroles"
version = "0.1.0"
description = "Backend do app de descoberta de rolês (piloto SP) — FastAPI + Postgres/PostGIS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0",
    # A janela de "hoje" da descoberta é calculada em America/Sao_Paulo (services/descoberta.py).
    # `zoneinfo` lê a base de fusos do sistema operacional, que imagens enxutas e Windows podem
    # não ter — e a falta dela levanta ZoneInfoNotFoundError em runtime, derrubando /descoberta
    # inteira. Declarar aqui tira a dependência do SO antes do deploy.
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
